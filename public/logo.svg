<svg width="160" height="40" viewBox="0 0 160 40" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HTG Travels — Tickets, Visas, Insurance">
  <defs>
    <linearGradient id="planeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#0FA3A3"/>
    </linearGradient>
  </defs>

  <!-- Brand mark: rounded square -->
  <rect x="2" y="4" width="32" height="32" rx="9" fill="#0B1F2A"/>
  <rect x="2" y="4" width="32" height="32" rx="9" fill="none" stroke="#F5A623" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Paper plane (gold-to-teal gradient) -->
  <path d="M26 11L9 18.5C8.3 18.8 8.3 19.8 9 20.1L13.5 21.6L15.5 27.5C15.7 28.1 16.5 28.2 16.8 27.6L19 23.8L23.5 27C24.1 27.4 24.9 27 25 26.3L27 12C27.1 11.2 26.5 10.7 26 11Z" fill="url(#planeGrad2)"/>
  <path d="M13.5 21.6L20 16L15 22.5L15.5 27.5L13.5 21.6Z" fill="#FFFFFF" fill-opacity="0.85"/>

  <!-- Gold dot accent -->
  <circle cx="26" cy="11" r="2.5" fill="#F5A623"/>

  <!-- Wordmark — explicit colors via CSS class on parent .text-foreground -->
  <!-- We use #0B1F2A here but it will be overridden by CSS filter in dark mode -->
  <text x="46" y="26" font-family="Sora, sans-serif" font-size="22" font-weight="700" fill="#0B1F2A" letter-spacing="-0.5">HTG</text>
  <text x="92" y="26" font-family="Sora, sans-serif" font-size="22" font-weight="400" fill="#0B1F2A" fill-opacity="0.55" letter-spacing="-0.3">Travels</text>

  <!-- Tagline dot -->
  <circle cx="148" cy="20" r="2" fill="#F5A623"/>
</svg>
