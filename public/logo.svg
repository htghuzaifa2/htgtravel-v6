<svg width="240" height="48" viewBox="0 0 240 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HTG Travels">
  <defs>
    <linearGradient id="htgGrad8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5A623"/>
      <stop offset="50%" stop-color="#0FA3A3"/>
      <stop offset="100%" stop-color="#0FA3A3"/>
    </linearGradient>
  </defs>

  <!-- HTG TRAVELS — full wordmark, gradient on both words -->
  <text x="4" y="35" font-family="Sora, sans-serif" font-size="30" font-weight="900" fill="url(#htgGrad8)" letter-spacing="-0.5">HTG</text>
  <text x="88" y="35" font-family="Sora, sans-serif" font-size="30" font-weight="800" fill="url(#htgGrad8)" letter-spacing="-0.5">TRAVELS</text>

  <!-- Gold dot accent between HTG and TRAVELS -->
  <circle cx="80" cy="25" r="3" fill="#F5A623"/>
</svg>
