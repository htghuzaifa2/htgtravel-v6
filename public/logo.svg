<svg width="120" height="44" viewBox="0 0 120 44" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HTG Travels">
  <defs>
    <linearGradient id="htgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5A623"/>
      <stop offset="50%" stop-color="#0FA3A3"/>
      <stop offset="100%" stop-color="#0FA3A3"/>
    </linearGradient>
  </defs>

  <!-- HTG monogram — bold gradient text, no icon -->
  <text x="4" y="33" font-family="Sora, sans-serif" font-size="32" font-weight="900" fill="url(#htgGrad)" letter-spacing="-1">HTG</text>

  <!-- Small gold dot accent after HTG (signature mark) -->
  <circle cx="86" cy="22" r="3" fill="#F5A623"/>

  <!-- 'Travels' wordmark — lighter, smaller -->
  <text x="96" y="29" font-family="Sora, sans-serif" font-size="14" font-weight="400" fill="#0B1F2A" fill-opacity="0.5" letter-spacing="0.5">Travels</text>
</svg>
