<svg width="280" height="48" viewBox="0 0 280 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HTG Travels">
  <defs>
    <linearGradient id="hGradD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#14B8B8"/>
    </linearGradient>
  </defs>

  <!-- H mark in a rounded square (brand icon before text) -->
  <rect x="2" y="6" width="36" height="36" rx="10" fill="#FFFFFF" fill-opacity="0.08"/>
  <text x="20" y="33" text-anchor="middle" font-family="Sora, sans-serif" font-size="24" font-weight="900" fill="url(#hGradD)">H</text>

  <!-- HTG TRAVELS text (white for dark mode) -->
  <text x="50" y="34" font-family="Sora, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">HTG TRAVELS</text>
</svg>
